[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["The Matter Labs Team <hello@matterlabs.dev>"]
homepage = "https://zksync.io/"
license = "MIT OR Apache-2.0"
keywords = ["blockchain", "zksync"]
categories = ["cryptography"]
repository = "https://github.com/matter-labs/zksync-crypto-gpu"
# All the packages in the workspace should have the same version
version = "0.156.4" # x-release-please-version

[workspace.dependencies]
# Local dependencies
boojum-cuda = { version = "=0.156.4", path = "crates/boojum-cuda" }
era_criterion_cuda = { version = "=0.156.4", path = "crates/criterion-cuda" }
era_cudart = { version = "=0.156.4", path = "crates/cudart" }
era_cudart_sys = { version = "=0.156.4", path = "crates/cudart-sys" }
era_cudart_sys_bindings_generator = { version = "=0.156.4", path = "crates/cudart-sys-bindings-generator" }
fflonk = { version = "=0.156.4", path = "crates/fflonk", package = "fflonk-cuda" }
gpu-ffi = { version = "=0.156.4", path = "crates/gpu-ffi", package = "zksync-gpu-ffi" }
gpu-ffi-bindings-generator = { version = "=0.156.4", path = "crates/gpu-ffi", package = "zksync-gpu-ffi-bindings-generator" }
gpu-prover = { version = "=0.156.4", path = "crates/gpu-prover", package = "zksync-gpu-prover" }
shivini = { version = "=0.156.4", path = "crates/shivini" }
wrapper-prover = { version = "=0.156.4", path = "crates/wrapper-prover", package = "zksync-wrapper-prover" }

# These dependencies should be shared by all the crates.
# zksync-crypto repository
boojum = "=0.32.10"
franklin-crypto = "=0.32.10"
rescue_poseidon = "=0.32.10"
snark_wrapper =  "=0.32.10"
fflonk-cpu = { package = "fflonk", version = "=0.32.10" }


# zksync-protocol repository
# Pinned to a git tag: zksync-protocol is no longer published to crates.io
# (it has a git-only `airbender-crypto` dependency).
# TEMPORARY: tag v0.153.14 predates the nightly fixes; retarget to the tag cut after
# matter-labs/zksync-protocol#235 merges.
circuit_definitions = { git = "https://github.com/matter-labs/zksync-protocol", branch = "chore/bump-nightly-2026-08-09" }
zkevm_test_harness = { git = "https://github.com/matter-labs/zksync-protocol", branch = "chore/bump-nightly-2026-08-09" }

[profile.release]
debug = "line-tables-only"

# TEMPORARY: boojum 0.32.10 as published on crates.io still carries
# `#![feature(array_chunks)]`, which nightly removed. The fix is on
# zksync-crypto main (cb466ac) but unreleased. Remove this section once
# boojum > 0.32.10 is published and the versions above are bumped to it.
[patch.crates-io]
boojum = { git = "https://github.com/matter-labs/zksync-crypto", rev = "c0a717cfef79b6edb92a3644dd92d6ac03e3b4a2" }
franklin-crypto = { git = "https://github.com/matter-labs/zksync-crypto", rev = "c0a717cfef79b6edb92a3644dd92d6ac03e3b4a2" }
rescue_poseidon = { git = "https://github.com/matter-labs/zksync-crypto", rev = "c0a717cfef79b6edb92a3644dd92d6ac03e3b4a2" }
snark_wrapper = { git = "https://github.com/matter-labs/zksync-crypto", rev = "c0a717cfef79b6edb92a3644dd92d6ac03e3b4a2" }
fflonk = { git = "https://github.com/matter-labs/zksync-crypto", rev = "c0a717cfef79b6edb92a3644dd92d6ac03e3b4a2" }
zksync_bellman = { git = "https://github.com/matter-labs/zksync-crypto", rev = "c0a717cfef79b6edb92a3644dd92d6ac03e3b4a2" }
zksync_pairing = { git = "https://github.com/matter-labs/zksync-crypto", rev = "c0a717cfef79b6edb92a3644dd92d6ac03e3b4a2" }
